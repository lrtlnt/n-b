name: Build XP Simulator

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    name: Build Windows EXE
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 761c8a172b88b85556275b517725855075b0e430
          vcpkgTriplet: x64-windows

      - name: Install dependencies
        run: |
          vcpkg install sdl2:x64-windows sdl2-image:x64-windows sdl2-ttf:x64-windows
          vcpkg integrate install

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package EXE
        run: |
          mkdir -p release/Windows
          cp build/Release/XPSimulator.exe release/Windows/
          cp build/Release/*.dll release/Windows/ 2>$null
          Compress-Archive -Path release/Windows/* -DestinationPath XPSimulator-Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: XPSimulator-Windows
          path: XPSimulator-Windows.zip

  build-android:
    runs-on: ubuntu-latest
    name: Build Android APK
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;25.2.9519653" "cmake;3.22.1" "platforms;android-33" "build-tools;33.0.2"

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Download SDL2 dependencies
        run: |
          cd android
          chmod +x prepare-deps.sh
          ./prepare-deps.sh

      - name: Build APK
        run: |
          cd android
          gradle assembleRelease

      - name: Package APK
        run: |
          mkdir -p release/Android
          cp android/app/build/outputs/apk/release/app-release.apk release/Android/XPSimulator.apk
          zip -j XPSimulator-Android.zip release/Android/XPSimulator.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: XPSimulator-Android
          path: XPSimulator-Android.zip
