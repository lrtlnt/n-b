name: Build Android APK & Windows EXE
on:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 重点：安装JDK17，解决版本不匹配
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        env:
          SKIP_JDK_VERSION_CHECK: true # 兜底兼容参数

      # ==========下方放你的C++/SDL编译打包脚本==========
      # 编译源码、ndk构建、生成APK、上传Artifacts

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      # Windows端编译步骤
