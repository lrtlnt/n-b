name: Build SDL2-XP Simulator
on:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ========== 第一步：优先安装JDK17 ==========
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.java-home }}

      # ========== 第二步：部署Android SDK（避开buggy setup-android@v3） ==========
      - name: Setup Android SDK Commandline Tools
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076758_latest.zip
          unzip commandlinetools-linux-11076758_latest.zip
          mv cmdline-tools latest
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-24" "build-tools;34.0.0" "ndk;26.2.11394342"

      # ========== 此处填入你的 C++ SDL2 NDK 编译脚本 ==========
      # 编译SDL2项目、构建APK
      # ./build_android.sh

      # 【可选】上传编译完成的APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsXP-Simulator-APK
          path: ./build/outputs/apk/release/*.apk


  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
      # Windows SDL2编译流程自行补充
